name: CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  go-backend:
    name: Go Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download Dependencies
        run: go mod download

      - name: Pre-pull Testcontainers images
        run: |
          pull_with_retry() {
            image="$1"
            for i in 1 2 3 4 5; do
              echo "Pulling ${image} (attempt ${i}/5)"
              if docker pull "${image}"; then
                return 0
              fi
              sleep $((i * 10))
            done
            echo "Failed to pull ${image}"
            return 1
          }

          pull_with_retry postgres:16-alpine
          pull_with_retry nats:2.10-alpine

      - name: Run Tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -v ./...

      - name: Build Server
        run: go build -o server ./cmd/server/main.go

  admin-ui:
    name: Admin UI Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/admin/package-lock.json'

      - name: Install dependencies
        run: |
          cd web/admin
          npm ci

      - name: Lint
        run: |
          cd web/admin
          npm run lint

      - name: Build
        run: |
          cd web/admin
          npm run build

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Server Image
        run: docker build -t masabbs-server -f Dockerfile.server .

      - name: Build Admin Image
        run: |
          cd web/admin
          docker build -t masabbs-admin .

  docker-compose-test:
    name: Docker Compose Connectivity Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-pull Compose images
        run: |
          pull_with_retry() {
            image="$1"
            for i in 1 2 3 4 5; do
              echo "Pulling ${image} (attempt ${i}/5)"
              if docker pull "${image}"; then
                return 0
              fi
              sleep $((i * 10))
            done
            echo "Failed to pull ${image}"
            return 1
          }

          pull_with_retry nats:2.10-alpine
          pull_with_retry postgres:16-alpine
          pull_with_retry minio/minio:latest

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          # Wait up to 2 minutes
          for i in {1..24}; do
            if docker compose ps | grep -q "unhealthy"; then
              echo "Waiting for unhealthy services..."
            elif [ "$(docker compose ps --filter "status=running" -q | wc -l)" -eq "6" ]; then
              # All 6 services (nats, db, minio, server, admin, proxy) should be running
              # Note: Some services might not have explicit healthchecks but should be up
              echo "All services are up."
              break
            fi
            echo "Attempt $i: Services not ready yet..."
            docker compose ps
            sleep 5
          done

      - name: Verify Proxy Connectivity (API)
        run: |
          # Test API through proxy on port 80
          # We expect a 200 from /health
          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || echo "failed")
            if [ "$RESPONSE" == "200" ]; then
              echo "Successfully connected to API through proxy!"
              exit 0
            fi
            echo "Attempt $i: API not reachable through proxy (Status: $RESPONSE). Retrying..."
            sleep 5
          done
          echo "Failed to connect to API through proxy"
          docker compose logs proxy
          docker compose logs server
          exit 1

      - name: Verify NATS Direct Connectivity
        run: |
          # Test if NATS port is accessible directly (for masatools/integration tests)
          nc -zv localhost 4222

      - name: Verify DB Direct Connectivity
        run: |
          # Test if DB port is accessible directly
          nc -zv localhost 5432

      - name: Verify MinIO Direct Connectivity
        run: |
          # Test if MinIO port is accessible directly
          nc -zv localhost 9000

      - name: Shutdown services
        if: always()
        run: docker compose down -v
