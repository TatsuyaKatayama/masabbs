name: CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test:
    name: Run Tests (UT & IT)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'masabbs/go.mod'
          cache-dependency-path: 'masabbs/go.sum'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('masabbs/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Dependencies
        working-directory: ./masabbs
        run: go mod download

      # Run Unit Tests (fast, no heavy containers usually except DB mock if any)
      - name: Run Unit Tests
        working-directory: ./masabbs
        run: go test -v ./internal/models/... ./internal/storage/... ./internal/api/...

      # Run DB Integrity and Integration Tests (uses Testcontainers)
      - name: Run Integration Tests
        working-directory: ./masabbs
        run: go test -v ./internal/db/... ./test/integration/...
