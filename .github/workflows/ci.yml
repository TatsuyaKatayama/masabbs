name: CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests (UT & IT)
    runs-on: ubuntu-latest
    # If masabbs is the root of the repository, uncomment the following line and remove 'working-directory' from steps:
    # defaults:
    #   run:
    #     working-directory: ./
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # If the repo root is 'masabbs', this should be 'go.mod'
          # If 'masabbs' is a folder inside the repo, this should be 'masabbs/go.mod'
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./internal/models/... ./internal/storage/... ./internal/api/...

      - name: Run Integration Tests
        run: go test -v ./internal/db/... ./test/integration/...

      - name: Run E2E Tests
        run: go test -v ./test/e2e/...
